name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # TODO: pin to SHA - Dependabot will handle this
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/check-dependency-age.mjs .
      - run: node scripts/check-dependency-age.mjs client
      - run: node scripts/check-dependency-age.mjs server
      - run: npm run lint
      - run: npm run compile
      - run: npx vsce package
