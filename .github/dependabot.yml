version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    cooldown:
      default-days: 30

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 30

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
